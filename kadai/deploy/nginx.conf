server {
    listen __PORT__;
    listen [::]:__PORT__;
    server_name _;              # replace with yourdomain.com after pointing DNS
    root /var/www/kadai;
    index index.html;

    # React Router: send every unknown path to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints files in /assets, so they can be cached for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the HTML shell, so new deploys show up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}
